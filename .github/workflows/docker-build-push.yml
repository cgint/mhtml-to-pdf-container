name: Docker Image To DockerHub CI/CD

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]

# Define environment variables at the workflow level
env:
  DOCKER_IMAGE_NAME: mht-to-pdf

# Define the jobs to run in the workflow
jobs:
  build_and_push:
    runs-on: ubuntu-latest # Use a GitHub-hosted runner with Ubuntu

    steps:
    # Checkout the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Log in to Docker Hub using the secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Get the image tag. This example uses the commit SHA.
    - name: Get image tag
      id: get_tag
      run: echo "IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    # Use a different tag for the cache, such as 'latest' or 'cache'
    - name: Set cache tag
      id: set_cache_tag
      run: echo "CACHE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:cache" >> $GITHUB_OUTPUT

    # Build the Docker image
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get_tag.outputs.IMAGE_TAG }}

        # ⬅️ Add these two lines for caching
        cache-from: type=registry,ref=${{ steps.set_cache_tag.outputs.CACHE_TAG }}
        cache-to: type=registry,ref=${{ steps.set_cache_tag.outputs.CACHE_TAG }},mode=max