name: Docker Image Push To DockerHub CI/CD

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]

# Define environment variables at the workflow level
env:
  DOCKER_IMAGE_NAME: mht-to-pdf

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get image tag
      id: get_tag
      run: echo "IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Set cache tag
      id: set_cache_tag
      run: echo "CACHE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:cache" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get_tag.outputs.IMAGE_TAG }}
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        cache-from: type=registry,ref=${{ steps.set_cache_tag.outputs.CACHE_TAG }}
        cache-to: type=registry,ref=${{ steps.set_cache_tag.outputs.CACHE_TAG }},mode=max