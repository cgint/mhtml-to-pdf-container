services:
  mht2pdf:
    image: mht-to-pdf:latest
    build:
      context: .
    ports:
      - "9111:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MAX_UPLOAD_MB=25
      - JOB_TIMEOUT_MS=120000
      - DEFAULT_PAGE_SIZE=A4
      - DEFAULT_MARGINS_MM=10
      - RENDERER=chromium
      - KEEP_JOBS=1
    restart: unless-stopped

